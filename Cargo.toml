[package]
name = "openidea-plugin-timestamp"
version = "0.1.0"
edition = "2024"
publish = false

# 插件独立构建，不加入任何 IDE workspace
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.50" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
